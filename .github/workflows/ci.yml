name: Premium CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {app: IAPutaOS/frontend, artifact: iaputa}
          - {app: livekit-frontend, artifact: nikolina}
          - {app: taskflow_pro_src, artifact: taskflow}
          - {app: dohler_src/frontend, artifact: dohler}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ${{ matrix.app }}/package-lock.json

    - name: Install dependencies
      run: |
        cd ${{ matrix.app }}
        npm ci

    - name: Lint
      run: |
        cd ${{ matrix.app }}
        npm run lint --if-present

    - name: Security audit
      run: |
        cd ${{ matrix.app }}
        npm audit --audit-level=high

    - name: Build
      run: |
        cd ${{ matrix.app }}
        npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}-build
        path: ${{ matrix.app }}/dist/

  backend-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Check LiveKit Python sources
      run: python -m compileall -q livekit-backend

    - name: Run domain and use-case tests against a temporary database
      env:
        PYTHONPATH: ${{ github.workspace }}/IAPutaOS
      working-directory: ${{ runner.temp }}
      run: |
        python -m pip install pytest pytest-asyncio 'pydantic>=2,<3'
        python -m pytest "$PYTHONPATH/tests" -q

  api-integration-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check gateway and read an empty task list locally
      run: |
        php -l api.php
        mkdir "$RUNNER_TEMP/gateway"
        cp api.php "$RUNNER_TEMP/gateway/"
        php -S 127.0.0.1:8181 -t "$RUNNER_TEMP/gateway" >"$RUNNER_TEMP/gateway.log" 2>&1 &
        trap 'kill $!' EXIT
        curl --fail --retry 5 --retry-connrefused --retry-delay 1 \
          'http://127.0.0.1:8181/api.php?action=get_tasks' | jq -e '. == []'

  security-scan:
    runs-on: ubuntu-latest
    needs: frontend-build

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  deploy:
    needs: [frontend-build, backend-test, api-integration-test, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Deploy to production
      env:
        FTP_HOST: ${{ secrets.FTP_HOST }}
        FTP_USER: ${{ secrets.FTP_USER }}
        FTP_PASS: ${{ secrets.FTP_PASS }}
        REMOTE_BASE: ${{ secrets.FTP_PATH || '/www' }}
        LOCAL_ROOT: ${{ github.workspace }}
        VPS_BACKUP: ${{ github.workspace }}/vps_backup
      run: |
        python vps_mirror_deploy.py
