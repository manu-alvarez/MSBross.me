name: Dependency remediation (one-time)

on:
  push:
    branches: [ci/validacion-nominalia]
    paths:
      - .github/workflows/dependency-remediation.yml

permissions:
  contents: write

jobs:
  refresh-and-verify:
    if: github.repository == 'manu-alvarez/MSBross.me'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/validacion-nominalia
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update vulnerable lockfile resolutions and verify each frontend
        shell: bash
        run: |
          set -euo pipefail
          for app in dohler_src/frontend taskflow_pro_src livekit-frontend IAPutaOS/frontend; do
            echo "::group::${app}"
            (
              cd "${app}"
              npm audit fix --package-lock-only || true
              npm ci
              npm run lint --if-present
              npm audit --audit-level=high
              npm run build
            )
            echo "::endgroup::"
          done
      - name: Commit tested dependency lockfile updates to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- dohler_src/frontend/package-lock.json taskflow_pro_src/package-lock.json livekit-frontend/package-lock.json IAPutaOS/frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): refresh audited frontend lockfiles'
          git push origin HEAD:ci/validacion-nominalia
